spring:
  application:
    name: ybcase-server
  jackson:
    # Jackson 默认用 UTC 序列化时间戳，而 JVM 已被 applyBusinessTimeZone 设为业务时区，
    # 结果是日志写 +08:00、接口返回 +00:00，界面原样展示的时间比实际早 8 小时
    # （消息时间 slice(0,16) 后看着像个正常时间，最不容易被发现）。
    # user.timezone 由 BureauServerApplication 在 SpringApplication.run 之前设好。
    time-zone: ${user.timezone:Asia/Shanghai}
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ybcase
    username: hip
    password: hip123456
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 执法音像（AV_RECORD）在 FILE 外置存储下允许到 200MB，容器上限须放到其之上，
      # 否则 AttachmentController 的分类限额永远走不到（此前一律卡在 10MB）
      max-file-size: ${YBCASE_MAX_FILE_SIZE:210MB}
      max-request-size: ${YBCASE_MAX_REQUEST_SIZE:220MB}

server:
  port: 8090

ybcase:
  security:
    # 生产/联网环境必须用环境变量 YBCASE_SECURITY_JWT_SECRET 覆盖（32 位以上随机串）；
    # 该默认值公开在代码仓库中，pilot profile 下使用它会拒绝启动
    jwt-secret: ${YBCASE_SECURITY_JWT_SECRET:dev-only-secret-change-me-bureau-case-0123456789}
    jwt-expiry-hours: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
