spring:
  application:
    name: ybcase-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ybcase
    username: hip
    password: hip123456
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8090

ybcase:
  security:
    # 生产环境务必通过环境变量 HIP_SECURITY_JWT_SECRET 覆盖
    jwt-secret: dev-only-secret-change-me-bureau-case-0123456789
    jwt-expiry-hours: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
